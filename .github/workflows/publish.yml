name: Render and Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Render site
        # GitHub Pages for this repo is configured as "Deploy from a branch:
        # main /docs" (NOT gh-pages) - so the only thing that actually makes
        # a change go live is committing a freshly-rendered docs/ back to
        # main. A previous version of this workflow pushed to gh-pages
        # instead, which is not the branch Pages is configured to serve from,
        # so it silently never went live no matter how successful the run was.
        run: quarto render

      - name: Commit and push rendered docs/ back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "docs/ unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Auto-render site [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
