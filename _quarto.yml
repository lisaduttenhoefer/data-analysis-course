project:
  type: website
  output-dir: docs
  resources:
    - "WEEK0/**"
    - "WEEK1/**"
    - "WEEK2/**"
    - "WEEK3/**"
    - "WEEK4/**"
    - "WEEK5/**"
    - "WEEK6/**"
    - "WEEK7/**"
    - "WEEK8/**"
    - ".nojekyll"
  render:
    - "*.qmd"
    - "!test_qmds/"
    - "!**/*.md"

filters:
  - shinylive

website:
  title: "METHODS IN DATA ANALYSIS"
  site-url: "https://lisaduttenhoefer.github.io/data-analysis-course"

  sidebar:
    style: "floating"
    contents:
      - text: "WELCOME"
        href: index.qmd
      - text: "Getting started"
        href: 0_markdown.qmd
      - text: "Basics in Coding"
        href: coding_basics.qmd
      - text: "Week 1: Datatypes"
        href: 1_datentypen.qmd
      - text: "Week 2: Data Cleanup"
        href: 2_data_cleanup.qmd
      - text: "Week 3: Correlation & Clustering"
        href: 3_correlation_clustering.qmd
      - text: "Week 4: Hierarchical Clustering & PCA"
        href: 4_unsupervised_learning.qmd
      - text: "Week 5: Probability Distributions"
        href: 5_probability_distributions.qmd
      - text: "Week 6: CLT & Confidence Intervals"
        href: 6_clt_confidence_intervals.qmd
      - text: "Week 7: Hypothesis Testing & t-Tests"
        href: 7_hypothesis_testing.qmd
      - text: "Week 8: Non-Parametric & Proportion Tests"
        href: 8_nonparametric_proportion_tests.qmd
      - text: "Week 9: Regression Analysis"
        href: 9_regression_analysis.qmd

  navbar:
    background: "#ffffff"
    right:
      - text: "PYTHON"
        href: "#"
      - text: "R"
        href: "#"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    embed-resources: false
    include-in-header:
      - language-switch.html
      - coi-header.html
    cache-bust: true

execute:
  enabled: true
  freeze: auto
  cache: false
