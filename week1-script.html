<script>
// ─── Supabase setup (CDN already loaded by language-switch.html in <head>) ───
const SUPABASE_URL = 'https://hpyezixseggwnrpepbhx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhweWV6aXhzZWdnd25ycGVwYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MTUzMDgsImV4cCI6MjA5MjM5MTMwOH0.HGcrv7-I07yFES2qBRhXf1j3UCbfMb8PwlWkQjY6NYs';

const W1_CHECKS   = ['check_w1_slides','check_w1_vid1','check_w1_vid2','check_w1_vid3','check_w1_md1','check_w1_md2'];
const W1_QUIZ_IDS = ['w1_q_vectors','w1_q_matrices','w1_q_lists','w1_q_dataframes'];

let sbClient;

(function init() {
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true }
  });

  const savedSession = sessionStorage.getItem('sb-session');
  if (savedSession) sbClient.auth.setSession(JSON.parse(savedSession));

  sbClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
      if (session) sessionStorage.setItem('sb-session', JSON.stringify(session));
      if (window.location.hash.includes('access_token'))
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    if (event === 'SIGNED_OUT') sessionStorage.removeItem('sb-session');
    await loadAndRenderProgress();
  });

  loadAndRenderProgress();
})();

async function loadAndRenderProgress() {
  const pm = await loadProgressMap();
  renderCheckboxes(pm);
  renderQuizBadges(pm);
  updateWeekBar(pm);
}

async function loadProgressMap() {
  const pm = {};
  const allKeys = [...W1_CHECKS, ...W1_QUIZ_IDS.map(id => 'quiz_r_w1_' + id)];
  allKeys.forEach(k => { if (localStorage.getItem(k) === 'true') pm[k] = true; });
  try {
    const savedSession = sessionStorage.getItem('sb-session');
    const user = savedSession ? JSON.parse(savedSession).user : null;
    if (user && sbClient) {
      const { data } = await sbClient.from('progress').select('key,value').eq('id', user.id);
      if (data) data.forEach(r => { if (r.value === 'true') pm[r.key] = true; });
    }
  } catch(e) {}
  return pm;
}

async function sbSaveProgress(key, value) {
  localStorage.setItem(key, value);
  try {
    const savedSession = sessionStorage.getItem('sb-session');
    const user = savedSession ? JSON.parse(savedSession).user : null;
    if (user && sbClient) await sbClient.from('progress').upsert({ id: user.id, key, value });
  } catch(e) { console.error('sbSaveProgress:', e); }
}

async function markCheckDone(el) {
  await sbSaveProgress(el.id, el.checked ? 'true' : 'false');
  const item = el.closest('.resource-item');
  if (item) item.classList.toggle('is-checked', el.checked);
  const pm = await loadProgressMap();
  updateWeekBar(pm);
}

async function markQuizDone(quizId) {
  const key = 'quiz_r_w1_' + quizId;
  await sbSaveProgress(key, 'true');
  const badge = document.getElementById('quiz-done-' + quizId);
  if (badge) badge.style.display = 'inline';
  const pm = await loadProgressMap();
  updateWeekBar(pm);
}

function renderCheckboxes(pm) {
  W1_CHECKS.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.checked = !!pm[id];
    const item = el.closest('.resource-item');
    if (item) item.classList.toggle('is-checked', !!pm[id]);
  });
}

function renderQuizBadges(pm) {
  W1_QUIZ_IDS.forEach(id => {
    if (pm['quiz_r_w1_' + id]) {
      const badge = document.getElementById('quiz-done-' + id);
      if (badge) badge.style.display = 'inline';
    }
  });
}

function updateWeekBar(pm) {
  const total = W1_CHECKS.length + W1_QUIZ_IDS.length;
  let done = 0;
  W1_CHECKS.forEach(k => { if (pm && pm[k]) done++; });
  W1_QUIZ_IDS.forEach(id => { if (pm && pm['quiz_r_w1_' + id]) done++; });
  const pct = Math.round((done / total) * 100);
  const bar = document.getElementById('week1-progress-bar');
  const txt = document.getElementById('week1-progress-text');
  if (bar) { bar.style.width = pct + '%'; bar.innerText = pct > 8 ? pct + '%' : ''; }
  if (txt) { txt.innerText = done + ' of ' + total + ' items completed'; }
}

// ─── Quiz 1: Vectors ─────────────────────────────────────────────────────────
function checkVektorQuiz() {
  var score = 0, total = 4;
  var v1 = document.querySelector('input[name="v1"]:checked'), v1f = document.getElementById('v1-feedback');
  if (v1 && v1.id === 'v1b') { v1f.innerHTML = '✅ Correct! The vector has 4 elements.'; v1f.style.color = '#1a4d1a'; score++; }
  else if (v1) { v1f.innerHTML = '❌ Count the elements: 9, 3, 7, 2 – that is 4.'; v1f.style.color = '#d9534f'; }
  var v2 = document.querySelector('input[name="v2"]:checked'), v2f = document.getElementById('v2-feedback');
  if (v2 && v2.id === 'v2b') { v2f.innerHTML = '✅ Exactly! In R, TRUE = 1 and FALSE = 0. sum() adds the ones.'; v2f.style.color = '#1a4d1a'; score++; }
  else if (v2) { v2f.innerHTML = '❌ Remember: TRUE = 1 and FALSE = 0 in R. sum(c(1,0,1,1)) = 3.'; v2f.style.color = '#d9534f'; }
  var v3 = document.querySelector('input[name="v3"]:checked'), v3f = document.getElementById('v3-feedback');
  if (v3 && v3.id === 'v3b') { v3f.innerHTML = '✅ Correct! Only elements 3 and 2 are less than 5.'; v3f.style.color = '#1a4d1a'; score++; }
  else if (v3) { v3f.innerHTML = '❌ y < 5 tests each element: 9→F, 3→T, 7→F, 2→T. So 3 and 2 are returned.'; v3f.style.color = '#d9534f'; }
  var v4 = document.querySelector('input[name="v4"]:checked'), v4f = document.getElementById('v4-feedback');
  if (v4 && v4.id === 'v4c') { v4f.innerHTML = '✅ Correct! R converts all elements to the lowest common type — here character.'; v4f.style.color = '#1a4d1a'; score++; }
  else if (v4) { v4f.innerHTML = '❌ Try str(c(TRUE, "FALSE", 3)) in RStudio to see the conversion!'; v4f.style.color = '#d9534f'; }
  var res = document.getElementById('vektor-result');
  if (score === total) { res.innerHTML = '🎉 All questions correct! Well done!'; res.style.color = '#1a4d1a'; markQuizDone('w1_q_vectors'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Review and try again!'; res.style.color = '#d9534f'; }
}

// ─── Quiz 2: Matrices ────────────────────────────────────────────────────────
function checkMatrixQuiz() {
  var score = 0, total = 3;
  var m1 = document.querySelector('input[name="m1"]:checked'), m1f = document.getElementById('m1-feedback');
  if (m1 && m1.id === 'm1b') { m1f.innerHTML = '✅ Correct! dim() always returns [rows, columns].'; m1f.style.color = '#1a4d1a'; score++; }
  else if (m1) { m1f.innerHTML = '❌ dim() returns [rows, columns]. With nrow=2, ncol=3 that is 2 3.'; m1f.style.color = '#d9534f'; }
  var m2 = document.querySelector('input[name="m2"]:checked'), m2f = document.getElementById('m2-feedback');
  if (m2 && m2.id === 'm2b') { m2f.innerHTML = '✅ Exactly! cbind = column bind, rbind = row bind.'; m2f.style.color = '#1a4d1a'; score++; }
  else if (m2) { m2f.innerHTML = '❌ cbind = "column bind", rbind = "row bind".'; m2f.style.color = '#d9534f'; }
  var m3 = document.querySelector('input[name="m3"]:checked'), m3f = document.getElementById('m3-feedback');
  if (m3 && m3.id === 'm3b') { m3f.innerHTML = '✅ Correct! The empty comma means: all columns. X[2, ] = all elements from row 2.'; m3f.style.color = '#1a4d1a'; score++; }
  else if (m3) { m3f.innerHTML = '❌ X[row, column] — empty field means everything. X[2, ] = all columns of row 2.'; m3f.style.color = '#d9534f'; }
  var res = document.getElementById('matrix-result');
  if (score === total) { res.innerHTML = '🎉 Perfect — all questions correct!'; res.style.color = '#1a4d1a'; markQuizDone('w1_q_matrices'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Try again!'; res.style.color = '#d9534f'; }
}

// ─── Quiz 3: Lists ───────────────────────────────────────────────────────────
function checkListQuiz() {
  var score = 0, total = 3;
  var l1 = document.querySelector('input[name="wl1"]:checked'), l1f = document.getElementById('wl1-feedback');
  if (l1 && l1.id === 'wl1b') { l1f.innerHTML = '✅ Exactly! Single [ ] returns a list, double [[ ]] returns the actual content.'; l1f.style.color = '#1a4d1a'; score++; }
  else if (l1) { l1f.innerHTML = '❌ Try length(List1["color"]) vs. length(List1[["color"]]) in RStudio!'; l1f.style.color = '#d9534f'; }
  var l2 = document.querySelector('input[name="wl2"]:checked'), l2f = document.getElementById('wl2-feedback');
  if (l2 && l2.id === 'wl2b') { l2f.innerHTML = '✅ Correct! First use [[ ]] to get the vector, then [2] for the second element.'; l2f.style.color = '#1a4d1a'; score++; }
  else if (l2) { l2f.innerHTML = '❌ List2[1] returns a list — use List2[[1]] to extract the vector first.'; l2f.style.color = '#d9534f'; }
  var l3 = document.querySelector('input[name="wl3"]:checked'), l3f = document.getElementById('wl3-feedback');
  if (l3 && l3.id === 'wl3b') { l3f.innerHTML = '✅ Correct! Assigning NULL to a list element with [[ ]] removes it completely.'; l3f.style.color = '#1a4d1a'; score++; }
  else if (l3) { l3f.innerHTML = '❌ rm() removes variables, not list elements. Use List2[[3]] <- NULL.'; l3f.style.color = '#d9534f'; }
  var res = document.getElementById('list-result');
  if (score === total) { res.innerHTML = '🎉 All correct — you have mastered lists!'; res.style.color = '#1a4d1a'; markQuizDone('w1_q_lists'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Try again!'; res.style.color = '#d9534f'; }
}

// ─── Quiz 4: Dataframes ──────────────────────────────────────────────────────
function checkDfQuiz() {
  var score = 0, total = 3;
  var d1 = document.querySelector('input[name="d1"]:checked'), d1f = document.getElementById('d1-feedback');
  if (d1 && d1.id === 'd1b') { d1f.innerHTML = '✅ Correct! A dataframe can mix types column by column — a matrix cannot.'; d1f.style.color = '#1a4d1a'; score++; }
  else if (d1) { d1f.innerHTML = '❌ The key difference is data types: matrices contain only one type, dataframes can mix.'; d1f.style.color = '#d9534f'; }
  var d2 = document.querySelector('input[name="d2"]:checked'), d2f = document.getElementById('d2-feedback');
  if (d2 && d2.id === 'd2b') { d2f.innerHTML = '✅ Correct! sum() on a logical vector counts the TRUE values (TRUE = 1). There are 3 fruits.'; d2f.style.color = '#1a4d1a'; score++; }
  else if (d2) { d2f.innerHTML = '❌ length() returns the total length (5). sum() counts the TRUE values.'; d2f.style.color = '#d9534f'; }
  var d3 = document.querySelector('input[name="d3"]:checked'), d3f = document.getElementById('d3-feedback');
  if (d3 && d3.id === 'd3b') { d3f.innerHTML = '✅ Exactly! Default all=FALSE = Inner Join. Only rows present in both are kept.'; d3f.style.color = '#1a4d1a'; score++; }
  else if (d3) { d3f.innerHTML = '❌ merge() default = Inner Join (only matching rows). Use all=TRUE to keep everything.'; d3f.style.color = '#d9534f'; }
  var res = document.getElementById('df-result');
  if (score === total) { res.innerHTML = '🎉 Excellent — Week 1 complete!'; res.style.color = '#1a4d1a'; markQuizDone('w1_q_dataframes'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Review and try again!'; res.style.color = '#d9534f'; }
}
</script>
