<script>
// ─── Supabase setup (CDN already loaded by language-switch.html in <head>) ───
const SUPABASE_URL = 'https://hpyezixseggwnrpepbhx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhweWV6aXhzZWdnd25ycGVwYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MTUzMDgsImV4cCI6MjA5MjM5MTMwOH0.HGcrv7-I07yFES2qBRhXf1j3UCbfMb8PwlWkQjY6NYs';

const W9_CHECKS   = ['check_w9_slides','check_w9_vid1','check_w9_vid2','check_w9_vid3','check_w9_vid4','check_w9_vid5','check_w9_md'];
const W9_QUIZ_IDS = ['w9_q_simple','w9_q_multiple','w9_q_evaluation','w9_q_ftest'];

let sbClient;

(function init() {
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true }
  });

  const savedSession = sessionStorage.getItem('sb-session');
  if (savedSession) sbClient.auth.setSession(JSON.parse(savedSession));

  sbClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
      if (session) sessionStorage.setItem('sb-session', JSON.stringify(session));
      if (window.location.hash.includes('access_token'))
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    if (event === 'SIGNED_OUT') sessionStorage.removeItem('sb-session');
    await loadAndRenderProgress();
  });

  loadAndRenderProgress();
})();

async function loadAndRenderProgress() {
  const pm = await loadProgressMap();
  renderCheckboxes(pm);
  renderQuizBadges(pm);
  updateWeekBar(pm);
}

async function loadProgressMap() {
  const pm = {};
  const allKeys = [...W9_CHECKS, ...W9_QUIZ_IDS.map(id => 'quiz_r_w9_' + id)];
  allKeys.forEach(k => { if (localStorage.getItem(k) === 'true') pm[k] = true; });
  try {
    const savedSession = sessionStorage.getItem('sb-session');
    const user = savedSession ? JSON.parse(savedSession).user : null;
    if (user && sbClient) {
      const { data } = await sbClient.from('progress').select('key,value').eq('id', user.id);
      if (data) data.forEach(r => { if (r.value === 'true') pm[r.key] = true; });
    }
  } catch(e) {}
  return pm;
}

async function sbSaveProgress(key, value) {
  localStorage.setItem(key, value);
  try {
    const savedSession = sessionStorage.getItem('sb-session');
    const user = savedSession ? JSON.parse(savedSession).user : null;
    if (user && sbClient) await sbClient.from('progress').upsert({ id: user.id, key, value });
  } catch(e) { console.error('sbSaveProgress:', e); }
}

async function markCheckDone(el) {
  await sbSaveProgress(el.id, el.checked ? 'true' : 'false');
  const item = el.closest('.resource-item');
  if (item) item.classList.toggle('is-checked', el.checked);
  const pm = await loadProgressMap();
  updateWeekBar(pm);
}

async function markQuizDone(quizId) {
  const key = 'quiz_r_w9_' + quizId;
  await sbSaveProgress(key, 'true');
  const badge = document.getElementById('quiz-done-' + quizId);
  if (badge) badge.style.display = 'inline';
  const pm = await loadProgressMap();
  updateWeekBar(pm);
}

function renderCheckboxes(pm) {
  W9_CHECKS.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.checked = !!pm[id];
    const item = el.closest('.resource-item');
    if (item) item.classList.toggle('is-checked', !!pm[id]);
  });
}

function renderQuizBadges(pm) {
  W9_QUIZ_IDS.forEach(id => {
    if (pm['quiz_r_w9_' + id]) {
      const badge = document.getElementById('quiz-done-' + id);
      if (badge) badge.style.display = 'inline';
    }
  });
}

function updateWeekBar(pm) {
  const total = W9_CHECKS.length + W9_QUIZ_IDS.length;
  let done = 0;
  W9_CHECKS.forEach(k => { if (pm && pm[k]) done++; });
  W9_QUIZ_IDS.forEach(id => { if (pm && pm['quiz_r_w9_' + id]) done++; });
  const pct = Math.round((done / total) * 100);
  const bar = document.getElementById('week9-progress-bar');
  const txt = document.getElementById('week9-progress-text');
  if (bar) { bar.style.width = pct + '%'; bar.innerText = pct > 8 ? pct + '%' : ''; }
  if (txt) { txt.innerText = done + ' of ' + total + ' items completed'; }
}

// ─── Quiz 1: Simple Linear Regression ────────────────────────────────────────
function checkSimpleQuiz() {
  var score = 0, total = 3;
  var q1 = document.querySelector('input[name="sr1"]:checked'), q1f = document.getElementById('sr1-feedback');
  if (q1 && q1.id === 'sr1a') { q1f.innerHTML = '✅ Correct! lm(y ~ x) fits a linear model of y on x.'; q1f.style.color = '#1a4d1a'; score++; }
  else if (q1) { q1f.innerHTML = '❌ lm(chol ~ glyhb, data=dat) fits a linear regression predicting chol from glyhb.'; q1f.style.color = '#d9534f'; }
  var q2 = document.querySelector('input[name="sr2"]:checked'), q2f = document.getElementById('sr2-feedback');
  if (q2 && q2.id === 'sr2a') { q2f.innerHTML = '✅ Right! Normal residuals + no correlation with the predictor.'; q2f.style.color = '#1a4d1a'; score++; }
  else if (q2) { q2f.innerHTML = '❌ Check that residuals are normally distributed and uncorrelated with the explanatory variable.'; q2f.style.color = '#d9534f'; }
  var q3 = document.querySelector('input[name="sr3"]:checked'), q3f = document.getElementById('sr3-feedback');
  if (q3 && q3.id === 'sr3a') { q3f.innerHTML = '✅ Exactly! With one predictor, the t-test and F-test give the same p-value.'; q3f.style.color = '#1a4d1a'; score++; }
  else if (q3) { q3f.innerHTML = '❌ For simple regression (1 predictor), the slope\'s t-test p-value equals the overall F-test p-value.'; q3f.style.color = '#d9534f'; }
  var res = document.getElementById('simple-result');
  if (score === total) { res.innerHTML = '🎉 All correct!'; res.style.color = '#1a4d1a'; markQuizDone('w9_q_simple'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Try again!'; res.style.color = '#d9534f'; }
}

// ─── Quiz 2: Multiple Regression ─────────────────────────────────────────────
function checkMultipleQuiz() {
  var score = 0, total = 3;
  var q1 = document.querySelector('input[name="mr1"]:checked'), q1f = document.getElementById('mr1-feedback');
  if (q1 && q1.id === 'mr1a') { q1f.innerHTML = '✅ Correct! The "." means "all other columns".'; q1f.style.color = '#1a4d1a'; score++; }
  else if (q1) { q1f.innerHTML = '❌ In an lm() formula, "." stands for all remaining columns in the dataframe as predictors.'; q1f.style.color = '#d9534f'; }
  var q2 = document.querySelector('input[name="mr2"]:checked'), q2f = document.getElementById('mr2-feedback');
  if (q2 && q2.id === 'mr2a') { q2f.innerHTML = '✅ Right! Multicollinearity makes individual contributions hard to separate.'; q2f.style.color = '#1a4d1a'; score++; }
  else if (q2) { q2f.innerHTML = '❌ weight/waist/hip are mutually correlated, which can mask their individual significance in the full model.'; q2f.style.color = '#d9534f'; }
  var q3 = document.querySelector('input[name="mr3"]:checked'), q3f = document.getElementById('mr3-feedback');
  if (q3 && q3.id === 'mr3a') { q3f.innerHTML = '✅ Correct! Removing correlated predictors can unmask a variable\'s real contribution.'; q3f.style.color = '#1a4d1a'; score++; }
  else if (q3) { q3f.innerHTML = '❌ This illustrates how multicollinearity can hide a variable\'s true effect until correlated variables are removed.'; q3f.style.color = '#d9534f'; }
  var res = document.getElementById('multiple-result');
  if (score === total) { res.innerHTML = '🎉 All correct!'; res.style.color = '#1a4d1a'; markQuizDone('w9_q_multiple'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Try again!'; res.style.color = '#d9534f'; }
}

// ─── Quiz 3: Model Evaluation ─────────────────────────────────────────────────
function checkEvaluationQuiz() {
  var score = 0, total = 3;
  var q1 = document.querySelector('input[name="me1"]:checked'), q1f = document.getElementById('me1-feedback');
  if (q1 && q1.id === 'me1a') { q1f.innerHTML = '✅ Correct! RMSE summarizes the typical prediction error size.'; q1f.style.color = '#1a4d1a'; score++; }
  else if (q1) { q1f.innerHTML = '❌ RMSE is the square root of the average squared prediction error — the typical size of a mistake.'; q1f.style.color = '#d9534f'; }
  var q2 = document.querySelector('input[name="me2"]:checked'), q2f = document.getElementById('me2-feedback');
  if (q2 && q2.id === 'me2a') { q2f.innerHTML = '✅ Right! Evaluating on training data overestimates real-world performance.'; q2f.style.color = '#1a4d1a'; score++; }
  else if (q2) { q2f.innerHTML = '❌ The model is fit to minimize error on the training data, so its training performance is optimistic vs. new data.'; q2f.style.color = '#d9534f'; }
  var q3 = document.querySelector('input[name="me3"]:checked'), q3f = document.getElementById('me3-feedback');
  if (q3 && q3.id === 'me3a') { q3f.innerHTML = '✅ Correct! Test RMSE is the more honest estimate of real performance.'; q3f.style.color = '#1a4d1a'; score++; }
  else if (q3) { q3f.innerHTML = '❌ Test-set RMSE is typically higher because the model never saw that data during training — a fairer evaluation.'; q3f.style.color = '#d9534f'; }
  var res = document.getElementById('evaluation-result');
  if (score === total) { res.innerHTML = '🎉 All correct!'; res.style.color = '#1a4d1a'; markQuizDone('w9_q_evaluation'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Try again!'; res.style.color = '#d9534f'; }
}

// ─── Quiz 4: F-Test, Coefficients & PCA ──────────────────────────────────────
function checkFtestQuiz() {
  var score = 0, total = 3;
  var q1 = document.querySelector('input[name="ft1"]:checked'), q1f = document.getElementById('ft1-feedback');
  if (q1 && q1.id === 'ft1a') { q1f.innerHTML = '✅ Correct! The F-test checks the model as a whole.'; q1f.style.color = '#1a4d1a'; score++; }
  else if (q1) { q1f.innerHTML = '❌ The overall F-test asks: does this model explain significantly more variance than no predictors at all?'; q1f.style.color = '#d9534f'; }
  var q2 = document.querySelector('input[name="ft2"]:checked'), q2f = document.getElementById('ft2-feedback');
  if (q2 && q2.id === 'ft2a') { q2f.innerHTML = '✅ Right! PCA components are uncorrelated by construction.'; q2f.style.color = '#1a4d1a'; score++; }
  else if (q2) { q2f.innerHTML = '❌ Principal components are mutually uncorrelated, which directly solves the multicollinearity problem.'; q2f.style.color = '#d9534f'; }
  var q3 = document.querySelector('input[name="ft3"]:checked'), q3f = document.getElementById('ft3-feedback');
  if (q3 && q3.id === 'ft3a') { q3f.innerHTML = '✅ Exactly! Each coefficient's t-test is about that one variable, holding others constant.'; q3f.style.color = '#1a4d1a'; score++; }
  else if (q3) { q3f.innerHTML = '❌ Each row in the coefficients table tests whether that specific predictor's effect is significant given the rest of the model.'; q3f.style.color = '#d9534f'; }
  var res = document.getElementById('ftest-result');
  if (score === total) { res.innerHTML = '🎉 Week 9 complete — you\'ve finished the whole course!'; res.style.color = '#1a4d1a'; markQuizDone('w9_q_ftest'); }
  else { res.innerHTML = score + ' of ' + total + ' correct. Try again!'; res.style.color = '#d9534f'; }
}
</script>
